{% extends 'base.html' %}

{% block title %}
    <title>Accueil du blog</title>
{% endblock %}

{% block content %}
<style>
    .blog-header {
        text-align: center;
        margin: 40px 0;
    }
    
    .blog-header img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    
    .blog-header h1 {
        font-family: 'Georgia', serif;
        color: #2c3e50;
        font-size: 2.5em;
        margin: 0;
    }
</style>

<div class="blog-header">
    <!-- Remplacez l'URL ci-dessous par le chemin de votre image -->
    <img src="https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=800&q=80" alt="Livres et plume">
    <h1>Le blog littéraire</h1>
</div>

{% endblock %}

    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <h5>Publié le {{ post.created_on|date:'j F Y' }}</h5>
            <p>{{ post.content|safe|truncatewords:50 }}</p>
        </article>
    {% endfor %}
{% endblock %}

{% extends 'base.html' %}

{% block title %}
    <title>Accueil du blog</title>
{% endblock %}

{% block content %}
<style>
    .blog-header {
        text-align: center;
        margin: 40px 0;
    }
    
    .blog-header img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    
    .blog-header h1 {
        font-family: 'Georgia', serif;
        color: #2c3e50;
        font-size: 2.5em;
        margin: 0;
    }
    
    /* Ajout de style pour les articles */
    article {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fff;
    }
</style>

<div class="blog-header">
    <img src="https://res.cloudinary.com/dxcap6jy/image/upload/v1787692665/livre_ouvert.jpgjAwLHdfMjAw/v1/bGl2cmVfb3V2ZXJ0/template_primary" alt="Livres et plume">
    <h1>Le blog littéraire</h1>
</div>

<!-- La boucle FOR est maintenant À L'INTÉRIEUR du bloc content -->
{% for post in posts %}
    <article>
        <h2>{{ post.title }}</h2>
        <h5>Publié le {{ post.created_on|date:'j F Y' }}</h5>
        <p>{{ post.content|safe|truncatewords:50 }}</p>
    </article>
{% endfor %}

<!-- Un seul endblock à la fin -->
{% endblock %}
